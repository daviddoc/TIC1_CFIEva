/* Breeze Claro (KDE Plasma) */
:root {
  --paper: #EFF0F1;
  --surface: #FCFCFC;
  --surface-2: #F4F5F6;
  --button: #FCFCFC;
  --hover: #E3F1FA;
  --checked: #CBE6F6;
  --checked-ink: #232629;
  --ink: #232629;
  --ink-2: #4D5257;
  --ink-3: #707D8A;
  --rule: #C6CACE;
  --rule-soft: #E3E5E7;
  --accent: #3DAEE9;
  --accent-ink: #10181E;
  --link: #2980B9;
  --stamp-bg: #8E44AD;
  --stamp-fg: #FCFCFC;
  --day-bg: #1E5774;
  --day-fg: #FCFCFC;
  --dt: #1E5774;
  --mark: #FCE5A8;
  --mark-ink: #2A2200;
  --late: #DA4453;
  --ok: #27AE60;
  --warn: #C45B00;
  --festivo: color-mix(in srgb, #DA4453 7%, var(--surface));
  --festivo-2: color-mix(in srgb, #DA4453 14%, var(--surface));
  --festivo-ink: #B8303E;
  --toast: #31363B;
  --toast-ink: #FCFCFC;
  --banner: #FDF0D5;
  --banner-ink: #4A3600;
  --banner-rule: #EBD7A6;
  --shadow: 0 10px 28px rgba(35, 38, 41, .18), 0 2px 6px rgba(35, 38, 41, .08);
  --sans: 'DejaVu Sans Mono', 'Hack', 'Cascadia Mono', Consolas, ui-monospace, monospace;
  --mono: 'DejaVu Sans Mono', 'Hack', 'Cascadia Mono', Consolas, ui-monospace, monospace;
  --r: 5px;
  color-scheme: light;
}
/* Breeze Oscuro (KDE Plasma 6): ventana #202326, listas #141618, botones #292C30, acento azul Plasma */
:root[data-theme="dark"] {
  --paper: #202326; --surface: #141618; --surface-2: #1D1F22; --button: #292C30;
  --hover: #1A2D37; --checked: #1E5774; --checked-ink: #FCFCFC;
  --ink: #FCFCFC; --ink-2: #BDC3C7; --ink-3: #A1A9B1; --rule: #3B3F44; --rule-soft: #26292D;
  --link: #3DAEE9; --dt: #6CC2EE;
  --mark: #5A4827; --mark-ink: #FCFCFC; --late: #EC5F6D; --ok: #27AE60; --warn: #F67400; --festivo-ink: #F07A86;
  --toast: #292C30; --toast-ink: #FCFCFC; --banner: #3B2E14; --banner-ink: #FDDCA0; --banner-rule: #5A4521;
  --shadow: 0 12px 34px rgba(0, 0, 0, .55), 0 0 0 1px #3B3F44; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --paper: #202326; --surface: #141618; --surface-2: #1D1F22; --button: #292C30;
    --hover: #1A2D37; --checked: #1E5774; --checked-ink: #FCFCFC;
    --ink: #FCFCFC; --ink-2: #BDC3C7; --ink-3: #A1A9B1; --rule: #3B3F44; --rule-soft: #26292D;
    --link: #3DAEE9; --dt: #6CC2EE;
    --mark: #5A4827; --mark-ink: #FCFCFC; --late: #EC5F6D; --ok: #27AE60; --warn: #F67400; --festivo-ink: #F07A86;
    --toast: #292C30; --toast-ink: #FCFCFC; --banner: #3B2E14; --banner-ink: #FDDCA0; --banner-rule: #5A4521;
    --shadow: 0 12px 34px rgba(0, 0, 0, .55), 0 0 0 1px #3B3F44; color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--link); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.s { width: 16px; height: 16px; }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ───── Cabecera ───── */
.top {
  position: sticky; top: 0; z-index: 30; min-height: 52px;
  display: flex; align-items: center; gap: 12px; padding: 8px 14px;
  background: var(--paper); border-bottom: 1px solid var(--rule);
}
.top-id { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 0 1 auto; }
.top-id > b { font-size: 18px; letter-spacing: -.01em; flex: none; }
.t-file { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.file-btn { font: 12.5px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28ch; min-width: 0; border-radius: 4px; padding: 2px 4px; }
.file-btn:hover { color: var(--ink); background: var(--hover); }
.t-estado { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.t-estado.mal { color: var(--ink); font-weight: 700; }
.top-acc { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; margin-left: auto; }
.top-acc .grow { flex: 1; }
.top-save { display: flex; gap: 8px; flex: none; }

/* Botones de guardar: pendiente (amarillo Breeze, palpitando) y hecho (✓ verde) */
.btn-guardar { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 5px; border: 1px solid var(--rule); background: transparent; color: var(--ink-2); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
@media (hover: hover) { .btn-guardar:hover { border-color: var(--accent); color: var(--ink); } }
.btn-guardar .ok { color: var(--ok); font-weight: 700; font-size: 16px; line-height: 1; }
.btn-guardar.pendiente { background: #FDBC4B; border-color: #FDBC4B; color: #232629; font-weight: 700; animation: latido-boton 1.6s ease-in-out infinite; }
.btn-guardar.pendiente:focus-visible { outline-color: #232629; }
@keyframes latido-boton {
  0% { box-shadow: 0 0 0 0 rgba(253, 188, 75, .8); }
  50% { background-color: #FFE6A6; }
  100% { box-shadow: 0 0 0 10px rgba(253, 188, 75, 0); }
}
.top.pendiente { animation: latido-cabecera 1.6s ease-in-out infinite; }
@keyframes latido-cabecera {
  0%, 100% { background-color: var(--paper); border-bottom-color: var(--rule); }
  50% { background-color: color-mix(in srgb, var(--late) 42%, var(--paper)); border-bottom-color: var(--late); }
}
.views { display: flex; gap: 2px; background: var(--button); border: 1px solid var(--rule); border-radius: 5px; padding: 2px; }
.views button { padding: 5px 12px; border-radius: 6px; color: var(--ink-2); font-weight: 600; font-size: 14px; }
.views button[aria-pressed="true"] { background: var(--checked); color: var(--checked-ink); }
.top .grow { flex: 1; }
.search { position: relative; display: flex; align-items: center; gap: 5px; min-width: 260px; max-width: min(620px, 50vw); height: 34px; padding: 0 4px 0 30px; border-radius: 5px; border: 1px solid var(--rule); background: var(--surface-2); cursor: text; }
.search:focus-within { background: var(--surface); border-color: var(--accent); }
.search.has { border-color: var(--accent); }
.search > .ico { position: absolute; left: 9px; color: var(--ink-3); pointer-events: none; }
.search input { flex: 1; min-width: 9ch; width: 100%; height: 32px; padding: 0; border: 0; outline: 0; background: transparent; }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd { font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }
.search:focus-within kbd, .search.has kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
.s-x { display: none; width: 24px; height: 24px; border-radius: 4px; color: var(--ink-3); font-size: 16px; line-height: 1; }
.s-x:hover { background: var(--hover); color: var(--ink); }
.search.has .s-x, .search input:not(:placeholder-shown) ~ .s-x { display: inline-grid; place-items: center; }
.qfc { display: flex; gap: 4px; align-items: center; flex: none; max-width: 70%; overflow-x: auto; scrollbar-width: none; }
.qfc:empty { display: none; }
.qfc::-webkit-scrollbar { display: none; }
.qfc .st, .qfc .pe, .qfc .tipo, .qfc .fx { flex: none; }
.fx { display: inline-flex; align-items: center; gap: 2px; padding: 0 2px 0 7px; border-radius: 4px; background: var(--checked); color: var(--checked-ink); font-size: 12px; line-height: 1.6; white-space: nowrap; }
.fx i, .fx-t i { font-style: normal; width: 16px; text-align: center; cursor: pointer; opacity: .8; }
.fx-t { display: inline-flex; align-items: center; padding-right: 2px; }
.s-btn.on { color: var(--accent); }
.search .sug { top: calc(100% + 4px); left: 0; right: 0; min-width: 300px; max-height: 420px; }
.ibtn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 5px; color: var(--ink-2); }
.ibtn:hover { background: var(--hover); color: var(--ink); }
.s-btn { display: none; }
.filters { display: flex; gap: 6px; align-items: center; min-width: 0; overflow: hidden; }
.fchip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 8px; border-radius: 999px; background: var(--checked); color: var(--checked-ink); font-size: 13px; white-space: nowrap; max-width: 260px; }
.fchip span { overflow: hidden; text-overflow: ellipsis; }
.fchip button { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; color: inherit; }
.fchip button:hover { background: rgba(255,255,255,.18); }

.banner { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--banner); color: var(--banner-ink); font-size: 14px; border-bottom: 1px solid var(--banner-rule); }
.banner .btn { margin-left: auto; }

/* ───── Botones ───── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 5px; font-weight: 600; font-size: 14px; border: 1px solid var(--rule); background: var(--button); color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.1); }
.btn.dan { color: var(--late); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }

/* ───── Añadir ───── */
.quick { position: relative; z-index: 25; padding: 12px 14px 4px; }
.q-row { display: flex; gap: 8px; align-items: stretch; }
.q-field {
  flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  min-height: 48px; padding: 6px 8px 6px 12px; border-radius: 6px;
  background: var(--surface); border: 1.5px solid var(--rule);
}
.q-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.q-field input { flex: 1; min-width: 12ch; border: 0; outline: 0; background: transparent; font-size: 16.5px; height: 34px; padding: 0; }
.q-field input::placeholder { color: var(--ink-3); }
.q-send { height: auto; min-width: 48px; padding: 0 16px; border-radius: 6px; }
.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 2px 4px; min-height: 40px; }
.seg { display: inline-flex; background: var(--button); border: 1px solid var(--rule); border-radius: 5px; padding: 2px; }
.seg button { padding: 4px 10px; border-radius: 6px; font-size: 13.5px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--checked); color: var(--checked-ink); }
.seg button.auto { box-shadow: inset 0 0 0 1.5px var(--ink-3); color: var(--ink); }
.q-parse { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.pchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 3px 2px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--rule); font-family: var(--mono); font-size: 12.5px; }
.pchip button { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; color: var(--ink-3); }
.pchip button:hover { background: var(--hover); color: var(--ink); }
.pchip.off { text-decoration: line-through; color: var(--ink-3); }
.q-dest { color: var(--ink-3); }
.q-dest b { color: var(--ink); font-weight: 600; }
.q-hint { color: var(--ink-3); font-size: 13px; }
.q-hint kbd, .kbd { font: 11.5px var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--ink-2); background: var(--surface); }

/* sugerencias */
.sug {
  position: absolute; z-index: 60; min-width: 280px; max-width: min(520px, calc(100vw - 24px)); max-height: 320px; overflow: auto;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); padding: 4px;
}
.sug button { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; padding: 7px 10px; border-radius: 6px; }
.sug button[aria-selected="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
.sug .sg-k { font: 13px var(--mono); }
.sug .sg-n { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.sug .sg-new { color: var(--link); font-weight: 600; }

/* ───── Sellos, personas, marcas ───── */
.st {
  display: inline-block; font: 11.5px/1.55 var(--mono); padding: 0 6px; border-radius: 3px;
  background: var(--stamp-bg); color: var(--stamp-fg); white-space: nowrap; vertical-align: 1px; letter-spacing: -.01em;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
button.st:hover { filter: brightness(1.15); }
.st.x { display: inline-flex; align-items: center; gap: 2px; padding-right: 2px; }
.st.x i { font-style: normal; width: 16px; text-align: center; opacity: .8; cursor: pointer; }
.pe { display: inline-block; font-size: 13px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 0 8px; line-height: 1.45; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
button.pe:hover { border-color: var(--ink-3); color: var(--ink); }
.pe.x { display: inline-flex; gap: 2px; padding-right: 3px; }
.pe.x i { font-style: normal; width: 16px; text-align: center; cursor: pointer; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 2px; }
.tipo { display: inline-block; font-size: 11.5px; font-weight: 700; background: var(--c); color: var(--ct, #141618); border-radius: 3px; padding: 0 5px; line-height: 1.45; vertical-align: 1px; letter-spacing: .02em; }
.dt { font: 12.5px var(--mono); color: var(--dt); white-space: nowrap; }
.dt.late { color: var(--late); font-weight: 700; }
.dt.warn { color: var(--warn); font-weight: 700; }
.ln { color: var(--link); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--link) 40%, transparent); word-break: break-all; }
.ln:hover { border-bottom-color: var(--link); }

/* ───── Tablero ───── */
.board {
  display: grid; gap: 12px; padding: 8px 14px 14px;
  grid-template-columns: minmax(300px, 1.15fr) repeat(3, minmax(250px, 1fr));
  height: calc(100vh - var(--alto-barra, 52px) - var(--quick-h, 104px) - var(--banner-h, 0px));
  height: calc(100dvh - var(--alto-barra, 52px) - var(--quick-h, 104px) - var(--banner-h, 0px));
}
.col { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--rule); min-height: 48px; }
.col-h h2 { margin: 0; font-size: 16px; font-weight: 700; }
.col-h .n { font: 12.5px var(--mono); color: var(--ink-3); }
.col-h .sp { flex: 1; }
.col-b { flex: 1; overflow: auto; overscroll-behavior: contain; padding-bottom: 24px; }
.grp { display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px; font-size: 13px; font-weight: 700; color: var(--ink-3); }
.grp button { color: inherit; font-weight: 700; display: inline-flex; gap: 4px; align-items: center; }
.grp .n { font: 12px var(--mono); font-weight: 400; }
.empty { padding: 18px 14px; color: var(--ink-3); font-size: 14px; }
.empty b { color: var(--ink-2); font-weight: 600; }

/* Hoy */
.col-hoy .col-h { background: var(--day-bg); color: var(--day-fg); border-bottom: 0; padding: 10px 8px 10px 14px; }
.col-hoy .col-h .n { color: color-mix(in srgb, var(--day-fg) 75%, transparent); }
.col-hoy .col-h .ibtn { color: var(--day-fg); width: 32px; height: 32px; }
.col-hoy .col-h .ibtn:hover { background: rgba(255,255,255,.14); }
.day-t { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.day-t b { font-size: 17px; }
.day-t span { font-size: 13.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back-today { font-size: 12.5px; font-weight: 700; color: var(--day-fg); border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 3px 8px; }
.fest { font-size: 12px; font-weight: 700; color: var(--festivo-ink); }

/* ───── Filas ───── */
.it { position: relative; border-bottom: 1px solid var(--rule-soft); touch-action: pan-y; outline-offset: -2px; overflow: hidden; }
.in { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px 9px 10px; background: var(--surface); }
@media (hover: hover) { .it:hover > .in { background: var(--hover); } }
.it:focus-visible { outline: 2px solid var(--accent); }
.it.sel > .in { box-shadow: inset 3px 0 0 var(--accent); background: var(--hover); }
.it.flash > .in { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 24%, var(--surface)); } }
.it.dragging { opacity: .4; }
.it.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.it.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.it.swr { background: var(--ok); }
.it.swl { background: var(--accent); }
.it.swr::before, .it.swl::before { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-weight: 700; font-size: 14px; }
.it.swr::before { content: 'Hecha'; left: 16px; }
.it.swl::before { content: 'Mover…'; right: 16px; }
.it.swiping > .in { transform: translateX(var(--sx, 0)); }
.it.snap > .in { transition: transform .18s ease-out; }
.ck {
  flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.8px solid var(--ink-3);
  display: grid; place-items: center; color: transparent; transition: background .12s, border-color .12s;
}
.ck:hover { border-color: var(--ok); color: var(--ok); }
.k-difusion .ck { border-radius: 5px; }
.k-espera .ck { border-style: dashed; }
.done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.done .tx { color: var(--ink-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-3) 60%, transparent); }
.bd { flex: 1; min-width: 0; cursor: pointer; }
.tx { overflow-wrap: anywhere; }
.tx:empty::before { content: 'Sin texto'; color: var(--ink-3); font-style: italic; }
.mt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; font-size: 13px; color: var(--ink-3); }
.mt:empty { display: none; }
.mt .nt { display: inline-flex; align-items: center; gap: 3px; }
.tm { flex: none; width: 46px; font: 12.5px/1.35 var(--mono); color: var(--ink-2); padding-top: 1px; }
.tm b { display: block; color: var(--ink); font-weight: 700; }
.tm span { color: var(--ink-3); }
.tm.all { min-height: 1px; }
.k-evento > .in { padding-left: 12px; }
.ac { position: absolute; right: 6px; top: 6px; display: none; gap: 2px; background: var(--surface); border: 1px solid var(--rule); box-shadow: 0 2px 8px rgba(18, 30, 45, .12); border-radius: 7px; padding: 2px; }
@media (hover: hover) { .it:hover .ac { display: flex; } }
.it:focus-within .ac { display: flex; }
.ac button { height: 26px; padding: 0 7px; border-radius: 5px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.ac button:hover { background: var(--surface); color: var(--ink); }
.sh { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.sh { gap: 3px; }
.sh button { height: 26px; padding: 0 5px; min-width: 26px; justify-content: center; border-radius: 4px; border: 1px solid var(--rule); font-size: 11.5px; font-weight: 600; color: var(--ink-2); background: var(--button); display: inline-flex; align-items: center; gap: 4px; }
.sh button:hover { border-color: var(--accent); color: var(--ink); }
.sh button.used { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 50%, transparent); color: var(--ok); }
.per { display: flex; gap: 8px; align-items: baseline; padding: 6px 12px; font-size: 13.5px; border-bottom: 1px solid var(--rule-soft); cursor: pointer; }
.per:hover { background: var(--hover); }
.per .pw { flex: none; max-width: 45%; overflow: hidden; }
.per .tx { flex: 1; min-width: 0; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pl { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.per .dt { flex: none; }
.swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-weight: 700; color: #fff; pointer-events: none; }
.swipe-bg.r { background: var(--ok); }
.swipe-bg.l { background: var(--accent); justify-content: flex-end; }
.it.swiping { transition: none; z-index: 2; }
.it.snap { transition: transform .18s ease-out; }

/* ───── Calendario ───── */
.cal { display: flex; flex-direction: column; height: calc(100vh - var(--alto-barra, 52px) - var(--quick-h, 104px) - var(--banner-h, 0px)); height: calc(100dvh - var(--alto-barra, 52px) - var(--quick-h, 104px) - var(--banner-h, 0px)); padding: 8px 14px 14px; gap: 10px; }
.cal-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-bar h2 { margin: 0 6px; font-size: 18px; font-weight: 700; }
.cal-body { flex: 1; min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; font-size: var(--cal-fs, 14px); }
.cal-body .st { font-size: .8em; }
.cal-body .mt { font-size: .9em; }
.cal-body .dt { font-size: .9em; }
.cal-body .tipo { font-size: .8em; }
.cal-body .tx { font-size: 1em; }
.wk { display: grid; grid-template-columns: repeat(5, minmax(10em, 1fr)) repeat(2, minmax(7.5em, .7fr)); min-height: 100%; }
.wk-g { position: relative; }
.wk-g > .wk-h { border-right: 1px solid var(--rule-soft); background: var(--surface); }
.wk-g > .wk-h.we, .wk-sh.we, .wk-g > .wk-b.we { background: var(--festivo); }
.wk-g > .wk-h.fes, .wk-sh.fes, .wk-g > .wk-b.fes { background: var(--festivo-2); }
.wk-sh { border-right: 1px solid var(--rule-soft); }
.wk-g > .wk-b { border-right: 1px solid var(--rule-soft); min-width: 0; padding-bottom: 20px; }
.wk-g > :nth-child(7n) { border-right: 0; }
.wk-g > .wk-h.today { box-shadow: inset 0 3px 0 var(--accent); }
.wk-g > .wk-h.today b { color: var(--dt); }
.wk-g > .wk-h.sel, .wk-g > .wk-b.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.wk-g > .wk-b.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
.wk-g > .band { position: relative; z-index: 1; margin: 2px 3px; width: auto; border: 0; border-radius: 5px; background: color-mix(in srgb, var(--stamp-bg) 13%, var(--surface)); }
.wk-g > .band.cl { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; }
.wk-g > .band.cr { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
.wk-g > .band:hover { background: color-mix(in srgb, var(--stamp-bg) 22%, var(--surface)); }
.wk-d { border-right: 1px solid var(--rule-soft); min-width: 0; display: flex; flex-direction: column; }
.wk-d:last-child { border-right: 0; }
.wk-d.we { background: var(--festivo); }
.wk-d.fes { background: var(--festivo-2); }
.wk-d.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
.wk-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 6px; padding: 8px 10px; background: inherit; border-bottom: 1px solid var(--rule); }
.wk-h > button:first-child { display: inline-flex; gap: 5px; align-items: baseline; white-space: nowrap; border-radius: 5px; padding: 0 3px; margin-left: -3px; }
.wk-h > button:first-child:hover { background: var(--hover); }
.wk-d:not(.fes):not(.we) .wk-h { background: var(--surface); }
.wk-h b { font-size: 1.07em; }
.wk-h span { font-size: .93em; color: var(--ink-3); }
.wk-h .add { margin-left: auto; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); }
.wk-h .add:hover { background: var(--hover); color: var(--ink); }
.wk-d.today .wk-h { box-shadow: inset 0 3px 0 var(--accent); }
.wk-d.today .wk-h b { color: var(--dt); }
.wk-d.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.wk-b { flex: 1; }
.wk-b .in { padding: 7px 8px; gap: 7px; font-size: 1em; }
.wk-b .it .tm { width: 3.6em; font-size: .85em; }
.wk-b .it .mt { margin-top: 3px; }
.band { display: block; width: 100%; text-align: left; font-size: .9em; padding: 3px 8px; border-bottom: 1px solid var(--rule-soft); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--stamp-bg) 7%, transparent); }
.band:hover { background: color-mix(in srgb, var(--stamp-bg) 14%, transparent); }
.band .st { font-size: .85em; margin-right: 4px; }

.mo { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto; grid-auto-rows: minmax(7.7em, 1fr); min-height: 100%; }
.mo-h { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 6px 8px; font-size: .93em; font-weight: 700; color: var(--ink-3); border-bottom: 1px solid var(--rule); }
.mc { border-right: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); padding: 4px 4px 6px; min-width: 0; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.mc:nth-child(7n) { border-right: 0; }
.mc:hover { background: var(--hover); }
.mc.out { color: var(--ink-3); }
.mc.out .mc-n { opacity: .55; }
.mc.we { background: var(--festivo); }
.mc.fes { background: var(--festivo-2); }
.mo-h.we { color: var(--festivo-ink); }
.wk-h.we b, .wk-h.fes b, .wk-d.we .wk-h b, .wk-d.fes .wk-h b, .mc.we .mc-n, .mc.fes .mc-n { color: var(--festivo-ink); }
.mc.drop { outline: 2px dashed var(--accent); outline-offset: -3px; }
.mc-n { font: .9em var(--mono); font-weight: 700; padding: 1px 4px; align-self: flex-start; border-radius: 4px; }
.mc.today .mc-n { background: var(--day-bg); color: var(--day-fg); }
.mc-e { font-size: .9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; border-radius: 3px; color: var(--ink-2); }
.mc-e b { font: .88em var(--mono); color: var(--ink); margin-right: 3px; }
.mc-e.t::before { content: '○ '; color: var(--ink-3); }
.mc-e.t.done { text-decoration: line-through; color: var(--ink-3); }
.mc-r { font-size: .8em; line-height: 1.45; height: 1.45em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; background: color-mix(in srgb, var(--stamp-bg) 16%, transparent); color: var(--ink-2); margin: 0 -4px; }
.mc-r.s { border-top-left-radius: 4px; border-bottom-left-radius: 4px; margin-left: 0; }
.mc-r.e { border-top-right-radius: 4px; border-bottom-right-radius: 4px; margin-right: 0; }
.mc-r.h { color: transparent; }
.mc-more { font-size: .86em; color: var(--ink-3); padding: 0 3px; }
.dots { display: none; }

/* ───── Hojas (editor, ajustes, hechas, mover) ───── */
.scrim { position: fixed; inset: 0; z-index: 70; background: rgba(12, 20, 30, .32); }
.sheet {
  position: fixed; z-index: 80; top: 0; right: 0; bottom: 0; width: min(460px, 100vw);
  background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
  border-left: 1px solid var(--rule);
}
.sheet.wide { width: min(720px, 100vw); }
.sheet.mini { top: 72px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); width: min(380px, calc(100vw - 24px)); max-height: calc(100dvh - 100px); border: 1px solid var(--rule); border-radius: 7px; }
.mc-g { height: 1.16em; }
.q-field { position: relative; }
.chipbox .sug { top: calc(100% + 4px); left: 0; }
.quick .sug { top: calc(100% + 4px); left: 0; }
.sh-h { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--rule); }
.sh-h h3 { margin: 0; font-size: 17px; flex: 1; }
.sh-b { flex: 1; overflow: auto; padding: 14px 16px 24px; }
.sh-f { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--rule); }
.fld { margin-bottom: 16px; }
.fld > label, .fld > .lbl { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.fld .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.inp, .ta { width: 100%; border: 1px solid var(--rule); border-radius: 5px; background: var(--surface-2); padding: 8px 10px; }
.inp:focus, .ta:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.ta { resize: vertical; min-height: 64px; line-height: 1.45; }
.ta.big { font-size: 16.5px; min-height: 76px; }
.ta.code { font: 13px/1.5 var(--mono); min-height: 180px; }
input[type="date"].inp, input[type="time"].inp { width: auto; font-family: var(--mono); font-size: 14px; }
.chipbox { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--surface-2); position: relative; min-height: 42px; }
.chipbox:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.chipbox input { flex: 1; min-width: 10ch; border: 0; outline: 0; background: transparent; height: 28px; }
.tog { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.tog input { width: 18px; height: 18px; accent-color: var(--accent); }
.mv { display: grid; gap: 2px; }
.mv button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 5px; font-size: 15px; }
.mv button:hover, .mv button:focus-visible { background: var(--hover); }
.mv button .k { margin-left: auto; }
.mv hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 0; }
.mv .hint { color: var(--ink-3); font-size: 13px; font-family: var(--mono); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; align-items: baseline; }
.keys dt { text-align: right; white-space: nowrap; }
.keys dd { margin: 0; color: var(--ink-2); }
.hgrp { font-size: 13px; font-weight: 700; color: var(--ink-3); margin: 14px 0 4px; }
.hgrp:first-child { margin-top: 0; }
.hecho .in { padding-left: 4px; padding-right: 4px; }
.colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 14px; }
.colors label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.colors input[type="color"] { width: 34px; height: 28px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 2px; background: var(--surface); }
.note { font-size: 13px; color: var(--ink-3); margin: 4px 0 0; }

/* ───── Diálogos de confirmación ───── */
.dlg-scrim { position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; padding: 16px; background: rgba(12, 20, 30, .5); }
.dlg { width: min(480px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 18px 18px 14px; }
.dlg h3 { margin: 0 0 8px; font-size: 17px; }
.dlg p { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; }
.dlg dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0 0 18px; font-size: 14px; }
.dlg dt { color: var(--ink-3); }
.dlg dd { margin: 0; overflow-wrap: anywhere; }
.dlg dd.mono { font-family: var(--mono); }
.dlg-b { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.btn.roja { background: var(--late); border-color: var(--late); color: #fff; }
.btn.roja:hover { filter: brightness(1.08); }

/* ───── Avisos ───── */
.toasts { position: fixed; z-index: 75; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 24px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 14px; padding: 9px 10px 9px 14px; border-radius: 6px; background: var(--toast); color: var(--toast-ink); box-shadow: var(--shadow); font-size: 14px; animation: tin .18s ease-out; }
.toast button { color: inherit; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,.14); }
:root[data-theme="dark"] .toast button { background: rgba(0,0,0,.12); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }

/* ───── Inicio ───── */
.start { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.start-card { width: min(520px, 100%); }
.start-card h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -.02em; }
.start-card p { color: var(--ink-2); margin: 0 0 22px; }
.start-card .acts { display: grid; gap: 10px; }
.start-card .btn { height: 46px; font-size: 15.5px; justify-content: flex-start; padding: 0 16px; }
.start-card .btn b.mono { font-weight: 700; }
.start-card .btn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.start-card .btn small { margin-left: auto; font: 12px var(--mono); color: inherit; opacity: .75; }
.start-card .sample { margin-top: 18px; font-size: 14px; }
.start-card .sample button { color: var(--link); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.start-card .warn { margin-top: 16px; font-size: 13.5px; color: var(--warn); }

/* ───── Barra inferior (móvil) ───── */
.tabbar { display: none; }

/* ───── Tableta: tres columnas ───── */
@media (max-width: 1279px) and (min-width: 1000px) {
  .board { grid-template-columns: minmax(300px, 1.1fr) minmax(250px, 1fr) minmax(250px, 1fr); }
  .board .col-espera { grid-column: 3; grid-row: 1; }
  .board .col-difusion { grid-column: 3; grid-row: 2; }
  .board { grid-template-rows: 1fr 1fr; }
  .board .col-hoy, .board .col-tareas { grid-row: 1 / span 2; }
  .search { min-width: 200px; max-width: 40vw; }
}

/* ───── Móvil y tableta vertical ───── */
@media (max-width: 999px) {
  body { font-size: 15px; }
  .views, .search kbd, .q-hint, .top-acc .grow { display: none; }
  .search { flex: 1 1 auto; min-width: 0; max-width: none; }
  .board { display: block; height: auto; padding: 0 0 calc(var(--quick-h, 64px) + 64px + env(safe-area-inset-bottom)); }
  .board .col { display: none; border: 0; border-radius: 0; background: transparent; overflow: visible; }
  .board[data-tab="hoy"] .col-hoy, .board[data-tab="tareas"] .col-tareas, .board[data-tab="espera"] .col-espera, .board[data-tab="difusion"] .col-difusion { display: flex; }
  .col-h { position: sticky; top: var(--alto-barra, 52px); z-index: 5; background: var(--paper); border-bottom: 0; padding: 12px 12px 8px; }
  .col-hoy .col-h { background: var(--day-bg); }
  .col-b { overflow: visible; background: var(--surface); }
  .in { padding: 12px 14px 12px 12px; }
  .ck { width: 22px; height: 22px; }
  .ac { display: none !important; }
  .cal { height: auto; padding: 8px 0 calc(var(--quick-h, 64px) + 64px + env(safe-area-inset-bottom)); }
  .cal-bar { padding: 0 10px; }
  .cal-body { border-radius: 0; border-left: 0; border-right: 0; overflow: visible; }
  .wk { display: block; }
  .wk-d { border-right: 0; border-bottom: 1px solid var(--rule); }
  .wk-h { position: static; padding: 10px 12px; }
  .wk-b .in { padding: 10px 12px; font-size: 1.05em; }
  .mo { grid-auto-rows: minmax(4.2em, auto); }
  .mc-e, .mc-r, .mc-g, .mc-more { display: none; }
  .wk-per { border-bottom: 1px solid var(--rule); background: var(--surface); }
  .wk-d .wk-b:empty { min-height: 0; }
  .dots { display: flex; flex-wrap: wrap; gap: 3px; padding: 2px 3px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .dots i.r { background: var(--stamp-bg); width: 12px; border-radius: 3px; }
  .dots i.ev { background: var(--accent); }
  .quick {
    position: fixed; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom)); padding: 8px 8px 8px;
    background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--rule);
    display: flex; flex-direction: column-reverse;
  }
  .quick:not(.active) .q-meta { display: none; }
  .q-meta { padding: 0 2px 8px; }
  .q-field { min-height: 46px; }
  .q-send { min-width: 46px; padding: 0 12px; }
  .q-send span { display: none; }
  .quick .sug { bottom: calc(100% - 4px); top: auto !important; left: 8px !important; right: 8px; max-width: none; min-width: 0; }
  .search .sug { max-width: none; min-width: 0; max-height: 60dvh; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 26; left: 0; right: 0; bottom: 0;
    height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface); border-top: 1px solid var(--rule);
  }
  .tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .tabbar button[aria-current="true"] { color: var(--ink); }
  .tabbar button[aria-current="true"] .ico { color: var(--accent); }
  .tabbar .b { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--late); color: #fff; font: 700 10.5px/17px var(--sans); text-align: center; }
  .tabbar .b.q { background: var(--ink-3); }
  .sheet, .sheet.mini { top: auto; left: 0; right: 0; transform: none; width: 100vw !important; max-height: 92dvh; border-radius: 16px 16px 0 0; border-left: 0; }
  .sheet::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: 8px auto 0; }
  .toasts { bottom: calc(var(--quick-h, 64px) + 70px + env(safe-area-inset-bottom)); }
}
/* ───── Cabecera en dos líneas: acciones abajo, botones de guardar arriba a la derecha ───── */
@media (max-width: 1179px) {
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id save" "acc acc"; gap: 8px 12px; }
  .top-id { grid-area: id; }
  .top-save { grid-area: save; }
  .top-acc { grid-area: acc; margin-left: 0; }
}
/* ───── Móvil: título y acciones arriba; los botones de guardar, en una fila propia ───── */
@media (max-width: 599px) {
  .top { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id acc" "save save"; padding: 6px 6px 8px 12px; gap: 6px; }
  .top-id { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 10px; }
  .t-file { flex-direction: column; align-items: flex-start; gap: 0; }
  .file-btn { max-width: 100%; padding: 0; font-size: 12px; }
  .t-estado { font-size: 12px; }
  .top-acc { gap: 0; }
  .top-save { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-right: 6px; }
  .top-save.uno { grid-template-columns: 1fr; }
  .btn-guardar { height: 44px; width: 100%; min-width: 0; padding: 0 8px; }
  .btn-guardar span { overflow: hidden; text-overflow: ellipsis; }
  .search { display: none; }
  .s-btn { display: inline-grid; }
  .search.open { display: flex; position: absolute; left: 8px; right: 92px; top: 8px; z-index: 3; max-width: none; min-width: 0; height: 36px; }
  .search.open ~ .s-btn { display: none; }
}
@media (max-width: 420px) {
  .top-id > b { font-size: 17px; }
  .seg button { padding: 4px 8px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .top.pendiente { background-color: color-mix(in srgb, var(--late) 42%, var(--paper)); border-bottom-color: var(--late); }
}

/* Arrastrar con el dedo (pulsación larga) */
.drag-ghost { position: fixed; z-index: 95; pointer-events: none; max-width: 260px; padding: 6px 10px; border-radius: 5px; background: var(--surface); color: var(--ink); border: 1px solid var(--accent); box-shadow: var(--shadow); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: translate(-50%, -130%); }
[data-id][draggable="true"] { cursor: grab; }
.mc-e[data-id]:hover, .mc-r[data-id]:hover { filter: brightness(1.2); }
.mc-e.dragging, .mc-r.dragging, .band.dragging { opacity: .4; }
@media (pointer: coarse) {
  .it, .band, .mc-e, .mc-r, .per { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
}
.range { display: flex; align-items: center; gap: 10px; }
.range input { width: 220px; accent-color: var(--accent); }
.range output { font-family: var(--mono); min-width: 5ch; }

/* Vista agenda del calendario */
.ag { max-width: 1000px; margin: 0 auto; padding-bottom: 12px; border-left: 1px solid var(--rule-soft); border-right: 1px solid var(--rule-soft); }
.ag-w { padding: 16px 14px 6px; font-size: .86em; font-weight: 700; color: var(--ink-3); }
.ag-d { border-top: 1px solid var(--rule); background: var(--surface); }
.ag-d.we { background: var(--festivo); }
.ag-d.fes { background: var(--festivo-2); }
.ag-d.we .in, .ag-d.fes .in, .wk-b.we .in, .wk-b.fes .in, .wk-d.we .in, .wk-d.fes .in { background: transparent; }
.ag-d.drop { outline: 2px dashed var(--accent); outline-offset: -3px; }
.ag-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 8px; padding: 9px 12px; background: inherit; border-bottom: 1px solid var(--rule-soft); }
.ag-h > button:first-child { display: inline-flex; gap: 6px; align-items: baseline; white-space: nowrap; border-radius: 4px; padding: 0 3px; margin-left: -3px; }
.ag-h > button:first-child:hover { background: var(--hover); }
.ag-h b { font-size: 1.07em; }
.ag-h span { color: var(--ink-3); }
.ag-h .rel { font-size: .86em; font-weight: 700; color: var(--dt); }
.ag-h .add { margin-left: auto; width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; color: var(--ink-3); }
.ag-h .add:hover { background: var(--hover); color: var(--ink); }
.ag-d.today .ag-h { box-shadow: inset 3px 0 0 var(--accent); }
.ag-d.today .ag-h b { color: var(--dt); }
.ag-d.we .ag-h b, .ag-d.fes .ag-h b { color: var(--festivo-ink); }
.ag-d .per { padding: 7px 12px; }
.ag-d .in { padding-left: 12px; }
.ag-empty { margin: 0; padding: 8px 14px 12px; color: var(--ink-3); font-size: .9em; }
.ag-more { display: flex; align-items: center; gap: 12px; padding: 16px 14px; color: var(--ink-3); font-size: .9em; border-top: 1px solid var(--rule); }
.per[data-gd][draggable="true"] { cursor: grab; }

</style>
</head>
<body>
<div id="app" hidden>
  <header class="top" id="top">
    <div class="top-id">
      <b>Agenda</b>
      <div class="t-file"><button class="file-btn" id="fileName" data-act="file" title="Archivo y ajustes"></button><span class="t-estado" id="estado" role="status" aria-live="polite"></span></div>
    </div>
    <div class="top-acc">
      <div class="views" role="group" aria-label="Vista">
        <button data-act="view" data-v="board" aria-pressed="true">Tablero</button>
        <button data-act="view" data-v="cal" aria-pressed="false">Calendario</button>
      </div>
      <span class="grow"></span>
      <div class="search" id="search">
        <svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span class="qfc" id="qfchips"></span>
        <input id="q" type="search" placeholder="Buscar  # @ !" autocomplete="off" aria-label="Buscar y filtrar"><kbd>/</kbd>
        <button type="button" class="s-x" data-act="clearsearch" aria-label="Quitar búsqueda y filtros">×</button>
      </div>
      <button class="ibtn s-btn" data-act="search" aria-label="Buscar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="ibtn" id="themeBtn" data-act="theme" aria-label="Cambiar tema"></button>
      <button class="ibtn" data-act="settings" aria-label="Ajustes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
    <div class="top-save" id="saveBtns" hidden>
      <button type="button" class="btn-guardar" id="bArchivo" data-act="guardararchivo" title="Guarda el .md en el archivo (Ctrl+S)" hidden></button>
      <button type="button" class="btn-guardar" id="bBackup" data-act="guardarbackup" title="Descarga un .zip con una copia del .md por cada cambio de esta sesión" hidden></button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <form class="quick" id="quick" autocomplete="off">
    <div class="q-row">
      <div class="q-field" id="qfield">
        <span id="qchips" style="display:contents"></span>
        <input id="qin" placeholder="Añade una tarea, un evento o un enlace…" aria-label="Añadir" enterkeyhint="done" autocapitalize="sentences" spellcheck="true">

  set(k, v) { try { localStorage.setItem('agenda.' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
};
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('agenda', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function idbKeys() { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbDel(k) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
/* En el navegador solo quedan preferencias de interfaz y el handle «archivo». Se borra lo que dejaron versiones anteriores. */
const PREFS = ['view', 'calMode', 'theme', 'calfs', 'lastBoard'];
async function limpiarNavegador() {
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith('agenda.') && !PREFS.includes(k.slice(7))) localStorage.removeItem(k);
    }
  } catch (e) { /* sin almacenamiento */ }
  try { for (const k of await idbKeys()) if (k !== 'archivo') await idbDel(k); } catch (e) { /* sin IndexedDB */ }
}

function darkNow() {
  const t = document.documentElement.dataset.theme;
  return t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
}
/* Texto legible sobre un color (oscuro o claro, el que más contraste dé) */
function inkFor(hex) {
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return '#141618';
  let h = m[1]; if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));
  return (L + 0.05) / 0.0627 >= 1.05 / (L + 0.05) ? '#141618' : '#FCFCFC';
}
const BREEZE = { colores: DEFAULT_YAML.colores, tipos: DEFAULT_YAML.tipos };
function applyConfig() {

  set('--accent', c.acento); set('--stamp-bg', c.proyecto_fondo); set('--stamp-fg', c.proyecto_texto);
  set('--day-bg', c.fecha_fondo); set('--day-fg', c.fecha_texto);
  if (!darkNow()) set('--mark', c.destacado); else st.removeProperty('--mark');
  if (!darkNow()) set('--dt', c.fecha_fondo); else st.removeProperty('--dt');
  FEST = C.festivosSet(Y().festivos);
  TIPOS = new Map(Object.entries(tipos()).map(([k, v]) => [C.fold(k), v]));
  const meta = $('meta[name="theme-color"]'); if (meta) meta.content = darkNow() ? '#202326' : '#EFF0F1';
}

/* ───────────── Archivo, sesión y cambios ─────────────
   Nada se guarda solo. Archivo.texto es el .md tal como está en la app; Archivo.base, el archivo
   tal como estaba al abrirlo o al guardarlo por última vez. Cada cambio pasa por aplicar() y deja
   en S.sesion una copia completa del .md, que solo sale de la memoria con «Guardar backup». */
const Archivo = { h: null, nombre: '', texto: '', base: '', mod: null, modo: '' };
const archivoPendiente = () => !!S.doc && Archivo.texto !== Archivo.base;
const backupPendiente = () => S.sesion.length > S.backupHasta;
const snapshot = () => ({ items: structuredClone(S.doc.items), yaml: structuredClone(S.doc.yaml) });
function restore(s) { S.doc.items = s.items; S.doc.yaml = s.yaml; applyConfig(); }
const serialize = () => C.serializeDoc(S.doc, today());
const pad2 = n => String(n).padStart(2, '0');
const hm = (d, sep = ':') => pad2(d.getHours()) + sep + pad2(d.getMinutes());
function fechaHora(ms) {
  const d = new Date(ms);
  return `${C.DIAS[d.getDay()]}, ${d.getDate()} de ${C.MESES[d.getMonth()]} de ${d.getFullYear()}, ${hm(d)}`;
}

/* Descripciones de los cambios (nombres de las copias del backup) */
const KW = { tarea: ['tarea', 'a'], evento: ['evento', 'o'], espera: ['en espera', 'a'], difusion: ['difusión', 'a'] };
const SECCION = { tarea: 'Tareas', espera: 'En espera', difusion: 'Difusión', evento: 'Calendario' };
function titulo(it) {
  const t = plain(it.text) || (it.projects[0] ? shortCode(it.projects[0]) : '') || '(sin texto)';
  return t.length > 40 ? t.slice(0, 39).trimEnd() + '…' : t;
}
const dm = d => d ? `${d.slice(8, 10)}-${d.slice(5, 7)}` : '';
function dsc(it, raiz, extra = '') { const [n, g] = KW[it.kind] || KW.tarea; return `${n} ${raiz}${g}${extra} · ${titulo(it)}`; }
function dscNuevo(it) {
  const t = titulo(it);
  if (it.kind === 'evento') return `evento nuevo · ${dm(it.date)} ${t}`;
  if (it.kind === 'difusion') return `difusión nueva · ${t}`;
  if (it.kind === 'espera') return `en espera nueva · ${t}`;
  return `nueva tarea · ${t}`;
}

/* La única puerta para cambiar el documento */
function aplicar(op, desc, o = {}) {
  const antes = serialize();
  const snap = o.undo === false ? null : snapshot();
  const r = op();
  const txt = serialize();
  if (txt === antes) return r;
  Archivo.texto = txt;
  const d = typeof desc === 'function' ? desc() : desc;
  const st = { hora: new Date(), desc: d || 'cambio', txt, grupo: o.grupo || null };
  const ult = S.sesion[S.sesion.length - 1];
  // Los cambios de una misma ficha abierta se juntan en una copia (si esa copia aún no está en un backup)
  if (o.grupo && ult && ult.grupo === o.grupo && S.sesion.length > S.backupHasta) Object.assign(ult, st);
  else S.sesion.push(st);
  if (snap) { S.undo.push({ snap, desc: st.desc }); if (S.undo.length > 80) S.undo.shift(); S.redo = []; }
  if (!S.avisado) { S.avisado = true; toast('Pulsa «Guardar archivo» (arriba) para guardarlo en el archivo.', null, 7000); }
  render();
  return r;
}
function undo() {
  if (!S.undo.length) { toast('No hay nada que deshacer'); return; }
  closeLayer(true);
  const u = S.undo.pop(), cur = snapshot();
  aplicar(() => restore(u.snap), 'deshacer · ' + u.desc, { undo: false });
  S.redo.push({ snap: cur, desc: u.desc });
  toast('Deshecho');
}
function redo() {
  if (!S.redo.length) return;
  const r = S.redo.pop(), cur = snapshot();
  aplicar(() => restore(r.snap), 'rehacer · ' + r.desc, { undo: false });
  S.undo.push({ snap: cur, desc: r.desc });
  toast('Rehecho');
}
function adoptIds(newItems, oldItems) {
  const pool = new Map();
  for (const it of oldItems) { const k = C.itemKey(it); if (!pool.has(k)) pool.set(k, []); pool.get(k).push(it.id); }
  for (const it of newItems) { const l = pool.get(C.itemKey(it)); if (l && l.length) it.id = l.shift(); }
}
function replaceDoc(text) {
  const old = S.doc ? S.doc.items : [];
  S.doc = C.parseDoc(text, today());
  adoptIds(S.doc.items, old);
  applyConfig();
  if (S.editId && !byId(S.editId)) closeLayer(true);
}

/* ───────────── Diálogos ───────────── */
function dialogo({ titulo: tit, texto, datos = [], botones }) {
  return new Promise(res => {
    const prev = document.activeElement;
    const box = document.createElement('div'); box.className = 'dlg-scrim';
    box.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"${texto ? ' aria-describedby="dlgP"' : ''}>
      <h3 id="dlgT">${esc(tit)}</h3>${texto ? `<p id="dlgP">${esc(texto)}</p>` : ''}
      ${datos.length ? `<dl>${datos.map(([t, d, m]) => `<dt>${esc(t)}</dt><dd${m ? ' class="mono"' : ''}>${esc(d)}</dd>`).join('')}</dl>` : ''}
      <div class="dlg-b">${botones.map((b, i) => `<button type="button" class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const btns = () => [...box.querySelectorAll('button')];
    const fin = v => { document.removeEventListener('keydown', onK, true); box.remove(); if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true }); res(v); };
    const onK = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fin(null); return; }
      if (e.key === 'Tab') {
        const l = btns(), i = l.indexOf(document.activeElement);
        e.preventDefault(); l[(i + (e.shiftKey ? -1 : 1) + l.length) % l.length].focus(); return;
      }
      e.stopPropagation();
    };
    box.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (b) fin(botones[+b.dataset.i].value);
      else if (e.target === box) fin(null);
    });
    document.addEventListener('keydown', onK, true);
    document.body.append(box);
    const f = botones.findIndex(b => b.foco);
    btns()[f >= 0 ? f : 0].focus();
  });
}
function contar(texto) {
  const d = C.parseDoc(texto, today()), T = today();
  const ab = d.items.filter(i => !i.done && i.kind !== 'evento');
  const hoy = ab.filter(i => i.kind !== 'espera' && i.date && i.date <= T).length;
  const tar = ab.filter(i => i.kind === 'tarea' && (!i.date || i.date > T)).length;
  const esp = ab.filter(i => i.kind === 'espera').length;
  return `${hoy} en Hoy · ${tar} en Tareas · ${esp} en En espera`;
}
const datosArchivo = (nombre, mod, texto) => [['Archivo', nombre, true], ['Última modificación', mod ? fechaHora(mod) : '—'], ['Tareas', contar(texto)]];
async function confirmarAbrir(nombre, mod, texto) {
  return (await dialogo({
    titulo: '¿Abrir este archivo?', datos: datosArchivo(nombre, mod, texto),
    botones: [{ label: 'Cancelar', value: null }, { label: 'Abrir', value: 'si', cls: 'pri', foco: true }],
  })) === 'si';
}
async function confirmarCambio() {
  if (!S.doc) return true;
  const pa = archivoPendiente(), pb = backupPendiente();
  if (!pa && !pb) return true;
  const texto = pa && pb ? 'No has guardado ni el archivo ni el backup. Si cambias de archivo, perderás los cambios de esta sesión y no te quedará ninguna copia de ellos.'
    : pa ? 'No has guardado el archivo. Si cambias de archivo, los cambios de esta sesión no estarán en él; solo te quedarán en el backup que descargaste.'
    : 'No has guardado el backup. Los cambios ya están en el archivo, pero perderás las copias de cada cambio de esta sesión.';
  return (await dialogo({
    titulo: '¿Cambiar de archivo?', texto,
    botones: [{ label: 'Cancelar', value: null, foco: true }, { label: 'Cambiar de archivo', value: 'si', cls: 'roja' }],
  })) === 'si';
}

/* ───────────── Abrir ───────────── */
const PICK = { id: 'agenda', types: [{ description: 'Agenda en Markdown', accept: { 'text/markdown': ['.md'], 'text/plain': ['.md', '.txt'] } }] };
function cursoNombre() { const [y, m] = C.parts(today()); const a = m >= 9 ? y : y - 1; return `agenda-${a}-${String(a + 1).slice(2)}.md`; }
function newDocText() {
  const doc = { yaml: { order: ['colores', 'tipos', 'redes', 'espera_aviso_dias', 'festivos', 'proyectos', 'personas'], raw: {}, data: structuredClone(DEFAULT_YAML) }, preamble: ['# Agenda'], extra: [], items: [] };
  return C.serializeDoc(doc, today());
}
/* Al abrir un archivo empieza una sesión nueva, sin cambios ni copias */
function cargar(a) {
  closeLayer(true);
  Archivo.h = a.h || null; Archivo.nombre = a.nombre; Archivo.texto = a.texto;
  Archivo.base = a.base ?? a.texto; Archivo.mod = a.mod || null; Archivo.modo = a.modo;
  S.sesion = []; S.backupHasta = 0; S.undo = []; S.redo = [];
  S.mostrarArchivo = false; S.guardadoA = null; S.avisado = false;
  if (a.h) S.recordado = a.h;
  S.doc = null; replaceDoc(Archivo.texto);
  document.title = `${Archivo.nombre} · Agenda`;
  showApp();
}
async function abrirHandle(h) {
  let f, texto;
  try { f = await h.getFile(); texto = norm(await f.text()); }
  catch (e) {
    toast(e.name === 'NotFoundError' ? `No encuentro «${h.name}». Ábrelo con «Abrir agenda…».` : 'No se pudo leer el archivo: ' + (e.message || e.name));
    return false;
  }
  if (!(await confirmarAbrir(f.name || h.name, f.lastModified, texto))) return false;
  cargar({ h, nombre: h.name || f.name, texto, mod: f.lastModified, modo: 'fs' });
  idbSet('archivo', h).catch(() => {});
  return true;
}
async function abrirArchivo() {
  if (!(await confirmarCambio())) return;
  if (!FS_OK) { abrirConInput(); return; }
  let h;
  try { [h] = await window.showOpenFilePicker(PICK); }
  catch (e) { if (e.name !== 'AbortError') toast('No se pudo abrir: ' + (e.message || e.name)); return; }
  await abrirHandle(h);
}
function abrirConInput() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.md,.txt,text/markdown,text/plain';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const texto = norm(await f.text());
    if (!(await confirmarAbrir(f.name, f.lastModified, texto))) return;
    cargar({ h: null, nombre: f.name, texto, mod: f.lastModified, modo: 'copia' });
  };
  inp.click();
}
async function seguirCon() {
  const h = S.recordado;
  if (!h) { abrirArchivo(); return; }
  if (!(await confirmarCambio())) return;
  let p = 'denied';
  try { p = await h.requestPermission({ mode: 'read' }); } catch (e) { p = 'error'; }
  if (p !== 'granted') { toast(`Sin permiso para leer «${h.name}». Ábrelo con «Abrir agenda…».`); return; }
  await abrirHandle(h);
}
async function crearNueva() {
  if (!(await confirmarCambio())) return;
  cargar({ h: null, nombre: cursoNombre(), texto: newDocText(), base: '', modo: 'nuevo' });
  toast('Agenda nueva. Pulsa «Guardar archivo» (arriba) para guardarla en un archivo.', null, 7000);
}
async function startDemo() {

}
/* Al volver a la ventana: si el archivo no tiene cambios pendientes y cambió fuera, se recarga */
async function releer() {
  if (!S.doc || Archivo.modo !== 'fs' || !Archivo.h || S.guardando || archivoPendiente() || document.hidden || layerOpen() || $('.dlg-scrim')) return;
  try {
    if (Archivo.h.queryPermission && (await Archivo.h.queryPermission({ mode: 'read' })) !== 'granted') return;
    const f = await Archivo.h.getFile();
    if (Archivo.mod && f.lastModified === Archivo.mod) return;
    const t = norm(await f.text());
    Archivo.mod = f.lastModified;
    if (t === Archivo.base || archivoPendiente() || S.guardando) return;
    Archivo.base = Archivo.texto = t;
    replaceDoc(t); render();
    toast('Agenda actualizada con los cambios del archivo.');
  } catch (e) { /* el archivo puede no estar disponible un momento */ }
}

function descargar(blob, nombre) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ───────────── Android: los dos botones abren el diálogo de compartir ─────────────
   Chrome para Android solo comparte ciertos tipos (txt, csv, html, pdf, imágenes…): ni .md ni .zip.
   Se intenta con el archivo tal cual; si lo rechaza, se ofrece una alternativa con un toque más
   (el navegador solo deja abrir el diálogo de compartir justo después de pulsar algo). */
const UA = navigator.userAgent || '';
// En las tabletas, Chrome abre por defecto el «sitio de escritorio» y se presenta como Linux: se reconoce por la pantalla táctil
const ANDROID = /Android/i.test(UA) || !!(navigator.userAgentData && navigator.userAgentData.platform === 'Android')
  || (/Linux/i.test(UA) && !/CrOS/i.test(UA) && navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches);
const conCompartir = () => ANDROID && typeof navigator.share === 'function';
/* Por qué no se puede compartir aquí ('' si se puede) */
function motivoSinCompartir() {
  if (typeof navigator.share !== 'function') {
    if (!window.isSecureContext) return location.protocol === 'http:'
      ? 'La agenda está abierta con http:// (sin «s»), y el navegador solo deja compartir en páginas abiertas con https:// o desde http://localhost.'
      : `La agenda está abierta como archivo («${location.protocol}//…»), y el navegador solo deja compartir en páginas abiertas con https:// o desde http://localhost.`;
    return 'Este navegador no tiene la opción de compartir. Usa Chrome.';
  }
  try {
    if (typeof navigator.canShare === 'function' && !navigator.canShare({ files: [new File(['x'], 'prueba.txt', { type: 'text/plain' })] }))
      return 'Este navegador no deja compartir archivos (Firefox para Android no lo permite). Usa Chrome.';
  } catch (e) { /* sin canShare fiable: se intenta igualmente */ }
  return '';
}
async function compartir(file) {
  try {
    if (typeof navigator.canShare === 'function' && !navigator.canShare({ files: [file] })) return 'rechazado';
    await navigator.share({ files: [file], title: file.name });
    return 'ok';
  } catch (e) {
    if (e.name === 'AbortError') return 'cancelado';
    if (e.name === 'NotAllowedError' || e.name === 'TypeError' || e.name === 'DataError') return 'rechazado';
    return 'error: ' + (e.message || e.name);

/* ───────────── Calendario ───────────── */

}

    items = persSug(tk.q, S.f.filter(x => x.t === 'pe').map(x => x.v)).filter(x => x.kind === 'pers').map(x => sgItem('pe', x.value, x.html, 'persona'));
